name: gkjw_karangpilang
description: "Aplikasi Resmi GKJW Jemaat Karangpilang"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend API & sesi admin

  # UI & Navigation
  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # PDF Viewer
  flutter_pdfview: ^1.3.2
  dio: ^5.8.0+1
  path_provider: ^2.1.5
  open_filex: ^4.6.0

  # Video
  youtube_player_flutter: ^9.1.1
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.20.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  lottie: ^3.3.1
  permission_handler: ^11.4.0

  # Spin Wheel
  flutter_fortune_wheel: ^1.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    # Sama dengan website GKJW Karangpilang (lisensi SIL OFL)
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-400-italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSerif4-600.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-700.ttf
          weight: 700

# Ikon aplikasi — jalankan ulang setelah mengganti logo:
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#F8F2E4"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 23

# Layar pertama sebelum Flutter siap: cream + logo, menyatu dengan animasi pembuka.
flutter_native_splash:
  color: "#F8F2E4"
  color_dark: "#0A1422"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#F8F2E4"
    color_dark: "#0A1422"
    image: assets/branding/splash_logo_android12.png
    icon_background_color: "#F8F2E4"
    icon_background_color_dark: "#0A1422"
  fullscreen: false
